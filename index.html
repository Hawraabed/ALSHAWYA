<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشواية | المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EC;
    --card:#FFFFFF;
    --ink:#2B2420;
    --gold:#B8863E;
    --gold-dark:#8F661F;
    --card-fill:rgba(43,36,32,.045);
    --card-border:rgba(43,36,32,.15);
    --text-soft:rgba(43,36,32,.62);
    --whatsapp:#25D366;
    --danger:#B5533A;
    --font-display:'Playfair Display',serif;
    --font-ui:'Poppins','Tajawal',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-ui);
    background:var(--cream);
    color:var(--ink);
    display:flex;
    justify-content:center;
    height:100vh;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  input,textarea{font-family:inherit;}

  /* ---------- Phone-sized frame ---------- */
  .device{
    width:100%;
    max-width:430px;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 8%, rgba(184,134,62,.10), transparent 40%),
      radial-gradient(circle at 85% 78%, rgba(184,134,62,.08), transparent 55%),
      linear-gradient(160deg, var(--cream) 0%, #F3E9D7 55%, var(--cream) 100%);
  }
  .device::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(43,36,32,.025) 0 2px, transparent 2px 90px),
      repeating-linear-gradient(25deg, rgba(43,36,32,.02) 0 2px, transparent 2px 110px);
    pointer-events:none;
  }

  .screen{
    position:absolute;top:0;left:0;width:100%;height:100%;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;-ms-overflow-style:none;
    padding:48px 26px 60px;
    display:flex;flex-direction:column;align-items:center;
    transition:transform .45s cubic-bezier(.65,0,.35,1), opacity .35s ease;
  }
  .screen::-webkit-scrollbar{display:none;}
  #homeScreen{transform:translateX(0);}
  #menuScreen{transform:translateX(100%);opacity:0;padding-top:0;align-items:stretch;}
  .device.show-menu #homeScreen{transform:translateX(-100%);}
  .device.show-menu #menuScreen{transform:translateX(0);opacity:1;}

  /* ---------- Home screen ---------- */
  .logo-mark{
    max-width:230px;width:80%;margin-bottom:18px;flex-shrink:0;
  }
  .logo-mark img{width:100%;height:auto;display:block;}
  .brand-name{
    position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;
  }

  .brand-tagline{
    text-align:center;color:var(--text-soft);font-size:13px;line-height:1.8;
    margin:0 0 34px;max-width:280px;font-weight:400;
  }

  .btn-stack{width:100%;display:flex;flex-direction:column;gap:14px;}
  .pill{
    width:100%;padding:16px 22px;border-radius:999px;
    font-size:14px;font-weight:600;letter-spacing:.3px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .15s ease, background .15s ease;
  }
  .pill:active{transform:scale(.97);}
  .pill-primary{
    background:var(--ink);color:var(--cream);
    box-shadow:0 10px 26px rgba(43,36,32,.22);
  }
  .pill-glass{
    background:var(--card);border:1px solid var(--card-border);
    color:var(--ink);box-shadow:0 4px 14px rgba(43,36,32,.06);
  }
  .pill-whatsapp{background:var(--whatsapp);color:#fff;}
  .pill svg{width:18px;height:18px;flex-shrink:0;}

  .divider{
    display:flex;align-items:center;gap:14px;width:100%;
    margin:22px 0;color:rgba(43,36,32,.4);
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(43,36,32,.16);}
  .divider svg{width:14px;height:14px;flex-shrink:0;}

  .rate-btn{
    width:100%;padding:16px 22px;border-radius:999px;
    background:linear-gradient(135deg, var(--gold), #A9812F);
    color:#1A1305;font-weight:700;font-size:14.5px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 10px 26px rgba(201,162,75,.32);
    margin-top:4px;
  }
  .rate-btn svg{width:18px;height:18px;}

  /* ---------- Menu screen header ---------- */
  .menu-sticky-top{
    position:sticky;top:0;z-index:30;background:var(--cream);
  }
  .menu-header{
    width:100%;display:flex;align-items:center;gap:12px;
    padding:20px 22px 14px;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;background:var(--card);
    border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;
    flex-shrink:0;position:relative;box-shadow:0 3px 10px rgba(43,36,32,.06);
  }
  .icon-btn svg{width:16px;height:16px;}
  .menu-header h2{
    font-family:var(--font-display);font-size:19px;margin:0;font-weight:700;flex:1;
  }
  .cart-badge{
    position:absolute;top:-5px;left:-5px;background:var(--gold);color:#1A1305;
    min-width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Category quick-nav ---------- */
  .cat-tabs{
    width:100%;display:flex;gap:10px;overflow-x:auto;
    padding:2px 22px 14px;
    scrollbar-width:none;
  }
  .cat-tabs::-webkit-scrollbar{display:none;}
  .cat-tab{
    flex-shrink:0;padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:var(--card);border:1px solid var(--card-border);color:var(--text-soft);
    white-space:nowrap;transition:background .2s ease, color .2s ease;
  }
  .cat-tab.active{
    background:linear-gradient(135deg, var(--gold), #A9812F);
    color:#1A1305;border-color:transparent;
  }

  .menu-body{padding:4px 22px 100px;}
  .menu-loading{text-align:center;color:var(--text-soft);padding:60px 10px;font-size:13px;}

  .cat-section{margin-bottom:32px;scroll-margin-top:130px;}
  .cat-section-title{
    font-family:var(--font-display);font-size:16px;color:var(--gold);
    letter-spacing:1.5px;text-transform:uppercase;margin:0 0 16px;
    display:flex;align-items:center;gap:10px;
  }
  .cat-section-title::after{content:"";flex:1;height:1px;background:rgba(201,162,75,.35);}

  /* ---------- Item cards grid ---------- */
  .items-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .item-card{
    background:var(--card);border:1px solid var(--card-border);
    border-radius:18px;overflow:hidden;text-align:right;
    transition:transform .15s ease;position:relative;box-shadow:0 4px 16px rgba(43,36,32,.05);
  }
  .item-card:active{transform:scale(.97);}
  .item-card.sold-out{opacity:.55;}
  .item-card-img{
    width:100%;aspect-ratio:1/1;background:linear-gradient(135deg, #EFE3CB, #F6EEDD);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .item-card-img img{width:100%;height:100%;object-fit:cover;}
  .item-card-img svg{width:34px;height:34px;opacity:.55;}
  .sold-out-tag{
    position:absolute;top:8px;inset-inline-start:8px;background:var(--danger);color:#2A0F07;
    font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;z-index:2;
  }
  .item-card-body{padding:10px 12px 13px;}
  .item-card-name{font-size:13px;font-weight:600;margin-bottom:5px;line-height:1.4;}
  .item-card-price-row{display:flex;align-items:baseline;gap:6px;}
  .item-card-price{font-family:var(--font-display);color:var(--gold);font-weight:700;font-size:13.5px;}
  .item-card-oldprice{font-size:11px;color:var(--text-soft);text-decoration:line-through;}

  /* ---------- Floating buttons ---------- */
  .rate-btn-floating{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    width:calc(100% - 52px);max-width:378px;z-index:40;
    padding:15px 22px;border-radius:999px;
    background:linear-gradient(135deg, var(--gold), #A9812F);
    color:#1A1305;font-weight:700;font-size:14px;
    display:none;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
  }
  .rate-btn-floating svg{width:17px;height:17px;}
  .device.show-menu .rate-btn-floating{display:flex;}

  /* ---------- Item detail modal ---------- */
  .item-modal-overlay{
    position:fixed;inset:0;background:rgba(4,10,18,.72);
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:80;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .item-modal-overlay.open{opacity:1;pointer-events:auto;}
  .item-modal{
    width:100%;max-width:430px;max-height:86vh;overflow-y:auto;
    scrollbar-width:none;-ms-overflow-style:none;
    background:var(--card);border-radius:26px 26px 0 0;
    position:relative;transform:translateY(20px);transition:transform .3s ease;
  }
  .item-modal-overlay.open .item-modal{transform:translateY(0);}
  .item-modal::-webkit-scrollbar{display:none;}
  .item-modal-close{
    position:absolute;top:14px;left:14px;z-index:2;
    width:34px;height:34px;border-radius:50%;
    background:rgba(0,0,0,.4);color:#fff;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .item-modal-image{
    width:100%;height:220px;background:linear-gradient(135deg, #EFE3CB, #F6EEDD);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .item-modal-image img{width:100%;height:100%;object-fit:cover;}
  .item-modal-image svg{width:56px;height:56px;opacity:.5;}
  .item-modal-body{padding:22px 24px 28px;}
  .item-modal-body h3{font-family:var(--font-display);font-size:20px;margin:0 0 8px;}
  .item-modal-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
  .item-modal-price{font-family:var(--font-display);color:var(--gold);font-weight:700;font-size:17px;}
  .item-modal-oldprice{font-size:13px;color:var(--text-soft);text-decoration:line-through;}
  .item-modal-body p{font-size:13.5px;line-height:1.9;color:var(--text-soft);margin:0 0 20px;}
  .criterion-rate-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-bottom:1px solid rgba(43,36,32,.08);
  }
  .criterion-rate-row .label{font-size:13.5px;font-weight:600;}
  .criterion-rate-row .stars{display:flex;gap:4px;font-size:22px;cursor:pointer;}
  .item-modal-qty-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .qty-btn{
    width:32px;height:32px;border-radius:50%;background:var(--card-fill);border:1px solid var(--card-border);
    color:var(--ink);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;
  }
  .qty-val{font-weight:700;font-size:15px;min-width:20px;text-align:center;}
  .add-to-cart-btn{
    width:100%;padding:15px;border-radius:999px;
    background:linear-gradient(135deg, var(--gold), #A9812F);
    color:#1A1305;font-weight:700;font-size:14.5px;
  }
  .add-to-cart-btn:disabled{background:var(--card-fill);color:var(--text-soft);}

  /* ---------- Cart panel ---------- */
  .cart-overlay{
    position:fixed;inset:0;background:rgba(4,10,18,.7);
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:90;
  }
  .cart-overlay.open{opacity:1;pointer-events:auto;}
  .cart-panel{
    position:fixed;top:0;left:0;height:100%;width:min(400px,100%);
    background:var(--card);z-index:95;box-shadow:8px 0 30px rgba(43,36,32,.12);
    box-shadow:20px 0 40px rgba(0,0,0,.4);
    transform:translateX(-105%);transition:transform .3s ease;
    display:flex;flex-direction:column;
  }
  .cart-panel.open{transform:translateX(0);}
  .cart-head{
    padding:20px 20px 14px;border-bottom:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .cart-head h2{margin:0;font-size:18px;font-family:var(--font-display);}
  .cart-scroll{flex:1;overflow-y:auto;padding:14px 20px;scrollbar-width:none;-ms-overflow-style:none;}
  .cart-scroll::-webkit-scrollbar{display:none;}
  .empty-cart{text-align:center;color:var(--text-soft);padding:50px 10px;font-size:13px;}
  .cart-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid rgba(43,36,32,.08);}
  .cart-item-img{
    width:52px;height:52px;border-radius:10px;flex-shrink:0;overflow:hidden;
    background:linear-gradient(135deg, #EFE3CB, #F6EEDD);
    display:flex;align-items:center;justify-content:center;
  }
  .cart-item-img img{width:100%;height:100%;object-fit:cover;}
  .cart-item-img svg{width:20px;height:20px;opacity:.5;}
  .cart-item-info{flex:1;min-width:0;}
  .cart-item-info h4{margin:0 0 4px;font-size:13.5px;font-weight:600;}
  .cart-item-info .unit-price{color:var(--text-soft);font-size:11.5px;margin:0 0 8px;}
  .cart-item-qty-row{display:flex;align-items:center;gap:10px;}
  .qty-btn-sm{
    width:24px;height:24px;border-radius:50%;background:var(--card-fill);border:1px solid var(--card-border);
    color:var(--ink);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  .remove-link{background:none;color:var(--danger);font-size:11px;text-decoration:underline;margin-inline-start:auto;}
  .line-total{font-weight:700;font-size:13px;white-space:nowrap;font-family:var(--font-display);color:var(--gold);}
  .cart-field{margin-bottom:12px;}
  .cart-field label{display:block;font-size:11.5px;color:var(--text-soft);margin-bottom:6px;font-weight:600;}
  .cart-field input,.cart-field textarea{
    width:100%;padding:11px 13px;border:1px solid var(--card-border);border-radius:10px;
    font-size:13.5px;background:rgba(43,36,32,.03);color:var(--ink);
  }
  .cart-field textarea{resize:vertical;min-height:50px;}
  .payment-section{margin-top:16px;display:none;}
  .payment-section.active{display:block;}
  .payment-options{display:flex;gap:8px;}
  .payment-option{
    flex:1;display:flex;align-items:center;gap:7px;
    border:1px solid var(--card-border);border-radius:10px;
    padding:9px 10px;font-size:12px;font-weight:600;
    cursor:pointer;background:rgba(43,36,32,.025);
  }
  .payment-option:has(input:checked){border-color:var(--gold);background:rgba(201,162,75,.15);}
  .payment-option input{width:auto;accent-color:var(--gold);}
  .payment-info-box{
    margin-top:12px;padding:11px 13px;border-radius:10px;
    background:rgba(184,134,62,.14);color:#7A5A22;font-size:11.5px;line-height:1.8;
  }
  .cart-summary{padding:14px 20px 20px;border-top:1px solid var(--card-border);flex-shrink:0;}
  .sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-soft);margin-bottom:7px;}
  .sum-row.total{color:var(--ink);font-weight:800;font-size:16px;margin-top:8px;font-family:var(--font-display);}
  .sum-row.savings{color:#2F8E52;font-weight:700;}
  .checkout-btn{
    margin-top:14px;width:100%;background:var(--whatsapp);color:#fff;
    padding:15px;border-radius:12px;font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .checkout-btn:disabled{opacity:.4;}

  @media (min-width:431px){
    body{height:100vh;}
    .device{height:100vh;max-height:900px;box-shadow:0 30px 80px rgba(0,0,0,.5);margin:auto 0;border-radius:28px;}
  }
</style>
</head>

      <div class="cart-field">
        <label for="custName">الاسم (اختياري)</label>
        <input type="text" id="custName" placeholder="اسمك الكامل">
      </div>
      <div class="cart-field">
        <label for="custPhone">رقم هاتفك (مطلوب)</label>
        <input type="tel" id="custPhone" placeholder="07xxxxxxxxx">
      </div>
      <div class="cart-field">
        <label for="custAddress">عنوان التوصيل (اختياري)</label>
        <textarea id="custAddress" placeholder="المحافظة، المنطقة، أقرب نقطة دالة"></textarea>
      </div>
      <div id="paymentMethodSection" class="payment-section">
        <label style="display:block;font-size:11.5px;color:var(--text-soft);margin-bottom:8px;font-weight:600;">طريقة الدفع</label>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="cod" checked>
            <span>عند الاستلام</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="electronic">
            <span id="electronicOptionLabel">دفع إلكتروني</span>
          </label>
        </div>
        <div id="paymentInfoBox"></div>
      </div>
    </div>
    <div class="cart-summary">
      <div class="sum-row"><span>المجموع قبل الخصم</span><span id="subtotalVal">0 د.ع</span></div>
      <div class="sum-row savings" id="savingsRow" style="display:none;"><span>إجمالي التوفير</span><span id="savingsVal">0 د.ع</span></div>
      <div class="sum-row"><span>التوصيل</span><span id="deliveryVal">0 د.ع</span></div>
      <div class="sum-row total"><span>المجموع الكلي</span><span id="totalVal">0 د.ع</span></div>
      <button class="checkout-btn" id="checkoutBtn" disabled>إتمام الطلب عبر واتساب</button>
    </div>
  </aside>

</div>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   ⚙️  إعدادات Firebase — الصق بيانات مشروعك هنا
   (نفس البيانات بالضبط اللي بتحطها بملف admin.html)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAiPbwsSUZPDqWT3QuMjpsUyerZFEUpCuY",
  authDomain: "shawai.firebaseapp.com",
  projectId: "shawai",
  storageBucket: "shawai.firebasestorage.app",
  messagingSenderId: "55219558697",
  appId: "1:55219558697:web:da4426107862c257863f38"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================================================
   لا حاجة لتعديل ما تحت هذا السطر
   ========================================================= */

const device = document.getElementById('device');
document.getElementById('viewMenuBtn').addEventListener('click', ()=> device.classList.add('show-menu'));
document.getElementById('backBtn').addEventListener('click', ()=> device.classList.remove('show-menu'));

let WHATSAPP_NUMBER = "";
let DELIVERY_FEE = 0;
let PAYMENT_LABEL = "";
let PAYMENT_ACCOUNT = "";
let ITEMS = [];
let CATEGORIES = [];
const cart = {};

const fmt = n => Number(n).toLocaleString('en-US') + " د.ع";
const PLATE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="1.3"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.2"/></svg>`;

function mediaHTML(item){
  const fallback = PLATE_ICON.replace(/'/g, "\\'").replace(/"/g,'&quot;');
  return item.image
    ? `<img src="${item.image}" alt="${item.name}" onerror="this.parentElement.innerHTML='${fallback}'">`
    : PLATE_ICON;
}

async function initMenu(){
  const body = document.getElementById('menuBody');
  try{
    const settingsDoc = await db.collection('settings').doc('store').get();
    if (settingsDoc.exists){
      const s = settingsDoc.data();
      WHATSAPP_NUMBER = s.whatsappNumber || "";
      DELIVERY_FEE = Number(s.deliveryFee) || 0;
      PAYMENT_LABEL = s.paymentLabel || "";
      PAYMENT_ACCOUNT = s.paymentAccount || "";
      RATING_CRITERIA = Array.isArray(s.ratingCriteria) ? s.ratingCriteria : [];

      document.getElementById('brandName').textContent = s.restaurantName || "الشواية";
      const taglineEl = document.getElementById('brandTagline');
      taglineEl.textContent = s.tagline || "";
      taglineEl.style.display = s.tagline ? "block" : "none";
      document.title = (s.restaurantName || "الشواية") + " | المنيو";

      document.getElementById('locationBtn').href = s.locationUrl || "#";
      document.getElementById('facebookBtn').href = s.facebookUrl || "#";
      document.getElementById('instagramBtn').href = s.instagramUrl || "#";
      document.getElementById('whatsappBtnHome').href = s.whatsappNumber ? `https://wa.me/${s.whatsappNumber}` : "#";
    }

    const snap = await db.collection('items').orderBy('createdAt','asc').get();
    ITEMS = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    CATEGORIES = [...new Set(ITEMS.map(it => it.category || 'أصناف أخرى'))];
  } catch(err){
    console.error(err);
    body.innerHTML = `<div class="menu-loading">تعذّر تحميل المنيو. تأكد من ضبط بيانات Firebase بالأعلى بشكل صحيح.</div>`;
    return;
  }

  renderCatTabs();
  renderMenuBody();
  renderPaymentSection();
}

function renderCatTabs(){
  const wrap = document.getElementById('catTabs');
  if (CATEGORIES.length === 0){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = CATEGORIES.map(cat => `<button class="cat-tab" data-cat="${cat}">${cat}</button>`).join('');
  wrap.querySelectorAll('.cat-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = document.getElementById('sec-' + cssEscape(btn.dataset.cat));
      if (target) target.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
}

function cssEscape(str){
  return String(str).replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_');
}

function renderMenuBody(){
  const body = document.getElementById('menuBody');
  if (ITEMS.length === 0){
    body.innerHTML = `<div class="menu-loading">المنيو ما انحدث بعد.</div>`;
    return;
  }
  body.innerHTML = CATEGORIES.map(cat => {
    const items = ITEMS.filter(it => (it.category || 'أصناف أخرى') === cat);
    return `
      <div class="cat-section" id="sec-${cssEscape(cat)}">
        <h3 class="cat-section-title">${cat}</h3>
        <div class="items-grid">
          ${items.map(item => `
            <div class="item-card ${item.inStock === false ? 'sold-out' : ''}" data-id="${item.id}">
              <div class="item-card-img">
                ${item.inStock === false ? '<span class="sold-out-tag">خلص</span>' : ''}
                ${mediaHTML(item)}
              </div>
              <div class="item-card-body">
                <div class="item-card-name">${item.name}</div>
                <div class="item-card-price-row">
                  ${item.oldPrice && Number(item.oldPrice) > Number(item.price) ? `<span class="item-card-oldprice">${fmt(item.oldPrice)}</span>` : ''}
                  <span class="item-card-price">${fmt(item.price)}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  body.querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', ()=> openItemModal(card.dataset.id));
  });

  // highlight active tab while scrolling
  const sections = CATEGORIES.map(cat => document.getElementById('sec-' + cssEscape(cat)));
  const tabs = document.getElementById('catTabs');
  document.getElementById('menuScreen').addEventListener('scroll', ()=>{
    let activeIdx = 0;
    sections.forEach((sec, i)=>{
      if (sec && sec.getBoundingClientRect().top < 160) activeIdx = i;
    });
    tabs.querySelectorAll('.cat-tab').forEach((t, i)=> t.classList.toggle('active', i === activeIdx));
  });
  if (tabs.querySelector('.cat-tab')) tabs.querySelector('.cat-tab').classList.add('active');
}

/* ---------- نافذة التقييم ---------- */
let RATING_CRITERIA = [];
let criteriaRatings = {};

function renderCriteriaPickers(){
  const wrap = document.getElementById('criteriaPickers');
  const labels = RATING_CRITERIA.length > 0 ? RATING_CRITERIA : ['التقييم العام'];
  criteriaRatings = {};
  labels.forEach(label => { criteriaRatings[label] = 0; });

  wrap.innerHTML = labels.map(label => `
    <div class="criterion-rate-row" data-label="${label}">
      <span class="label">${label}</span>
      <span class="stars" data-label="${label}"></span>
    </div>
  `).join('');

  labels.forEach(label => renderOneCriterionStars(label));
}

function renderOneCriterionStars(label){
  const starsEl = document.querySelector(`.stars[data-label="${CSS.escape(label)}"]`);
  if (!starsEl) return;
  starsEl.innerHTML = '';
  for (let i = 1; i <= 5; i++){
    const star = document.createElement('span');
    star.textContent = i <= criteriaRatings[label] ? '⭐' : '☆';
    star.style.color = i <= criteriaRatings[label] ? '#B8863E' : 'rgba(43,36,32,.3)';
    star.addEventListener('click', ()=>{
      criteriaRatings[label] = i;
      renderOneCriterionStars(label);
      updateSubmitState();
    });
    starsEl.appendChild(star);
  }
}

function updateSubmitState(){
  const allRated = Object.values(criteriaRatings).every(v => v > 0);
  document.getElementById('submitRateBtn').disabled = !allRated;
}

function openRateModal(){
  document.getElementById('rateName').value = '';
  document.getElementById('rateComment').value = '';
  document.getElementById('rateMsg').textContent = '';
  document.getElementById('submitRateBtn').disabled = true;
  document.getElementById('submitRateBtn').textContent = 'إرسال التقييم';
  document.getElementById('rateFormView').style.display = 'block';
  document.getElementById('rateThanksView').style.display = 'none';
  renderCriteriaPickers();
  document.getElementById('rateModalOverlay').classList.add('open');
}
function closeRateModal(){ document.getElementById('rateModalOverlay').classList.remove('open'); }

document.getElementById('rateBtnHome').addEventListener('click', openRateModal);
document.getElementById('floatingRateBtn').addEventListener('click', openRateModal);
document.getElementById('closeRateModal').addEventListener('click', closeRateModal);
document.getElementById('rateModalOverlay').addEventListener('click', (e)=>{
  if (e.target.id === 'rateModalOverlay') closeRateModal();
});

document.getElementById('submitRateBtn').addEventListener('click', async ()=>{
  const msgEl = document.getElementById('rateMsg');
  const allRated = Object.values(criteriaRatings).every(v => v > 0);
  if (!allRated){ msgEl.textContent = 'الرجاء تقييم كل المعايير بالنجوم.'; return; }

  const btn = document.getElementById('submitRateBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';

  try{
    await db.collection('reviews').add({
      ratings: criteriaRatings,
      name: document.getElementById('rateName').value.trim() || null,
      comment: document.getElementById('rateComment').value.trim() || null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('rateFormView').style.display = 'none';
    document.getElementById('rateThanksView').style.display = 'block';
    setTimeout(closeRateModal, 1800);
  } catch(err){
    console.error(err);
    msgEl.textContent = 'تعذّر إرسال التقييم، حاول مرة أخرى.';
    btn.disabled = false;
    btn.textContent = 'إرسال التقييم';
  }
});

/* ---------- نافذة تفاصيل الصنف ---------- */
let modalItemId = null;
let modalQty = 1;

function openItemModal(id){
  const item = ITEMS.find(x => x.id === id);
  if (!item) return;
  modalItemId = id;
  modalQty = 1;

  document.getElementById('itemModalImage').innerHTML = mediaHTML(item);
  document.getElementById('itemModalName').textContent = item.name;
  document.getElementById('itemModalPrice').textContent = fmt(item.price);
  document.getElementById('itemModalOldPrice').textContent = (item.oldPrice && Number(item.oldPrice) > Number(item.price)) ? fmt(item.oldPrice) : '';
  document.getElementById('itemModalDesc').textContent = item.desc || '';
  document.getElementById('modalQtyVal').textContent = modalQty;

  const addBtn = document.getElementById('modalAddBtn');
  const inStock = item.inStock !== false;
  addBtn.disabled = !inStock;
  addBtn.textContent = inStock ? 'أضف للسلة' : 'نفذت الكمية';
  document.getElementById('modalQtyMinus').disabled = !inStock;
  document.getElementById('modalQtyPlus').disabled = !inStock;

  document.getElementById('itemModalOverlay').classList.add('open');
}
function closeItemModal(){ document.getElementById('itemModalOverlay').classList.remove('open'); }
document.getElementById('closeItemModal').addEventListener('click', closeItemModal);
document.getElementById('itemModalOverlay').addEventListener('click', (e)=>{
  if (e.target.id === 'itemModalOverlay') closeItemModal();
});
document.getElementById('modalQtyMinus').addEventListener('click', ()=>{
  modalQty = Math.max(1, modalQty - 1);
  document.getElementById('modalQtyVal').textContent = modalQty;
});
document.getElementById('modalQtyPlus').addEventListener('click', ()=>{
  modalQty += 1;
  document.getElementById('modalQtyVal').textContent = modalQty;
});
document.getElementById('modalAddBtn').addEventListener('click', ()=>{
  if (!modalItemId) return;
  cart[modalItemId] = (cart[modalItemId] || 0) + modalQty;
  renderCart();
  closeItemModal();
  openCart();
});

/* ---------- السلة ---------- */
function computeTotals(){
  const ids = Object.keys(cart);
  let naiveSubtotal = 0, originalSubtotal = 0;
  ids.forEach(id=>{
    const item = ITEMS.find(x => x.id === id);
    if (!item) return;
    const qty = cart[id];
    naiveSubtotal += Number(item.price) * qty;
    const perUnitOriginal = (item.oldPrice && Number(item.oldPrice) > Number(item.price)) ? Number(item.oldPrice) : Number(item.price);
    originalSubtotal += perUnitOriginal * qty;
  });
  return { naiveSubtotal, originalSubtotal, savings: originalSubtotal - naiveSubtotal };
}

function renderCart(){
  const ids = Object.keys(cart);
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const badge = document.getElementById('cartCount');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';

  const itemsEl = document.getElementById('cartItems');
  if (ids.length === 0){
    itemsEl.innerHTML = `<div class="empty-cart">سلتك فارغة حالياً<br>تصفح المنيو وأضف أصنافك 🍽️</div>`;
    document.getElementById('subtotalVal').textContent = fmt(0);
    document.getElementById('savingsRow').style.display = 'none';
    document.getElementById('deliveryVal').textContent = fmt(DELIVERY_FEE);
    document.getElementById('totalVal').textContent = fmt(0);
    document.getElementById('checkoutBtn').disabled = true;
    return;
  }

  itemsEl.innerHTML = ids.map(id=>{
    const item = ITEMS.find(x => x.id === id);
    if (!item) return '';
    const qty = cart[id];
    const lineTotal = Number(item.price) * qty;
    return `
      <div class="cart-item">
        <div class="cart-item-img">${mediaHTML(item)}</div>
        <div class="cart-item-info">
          <h4>${item.name}</h4>
          <p class="unit-price">${fmt(item.price)} / قطعة</p>
          <div class="cart-item-qty-row">
            <button class="qty-btn-sm" onclick="changeQty('${id}',-1)">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn-sm" onclick="changeQty('${id}',1)">+</button>
            <button class="remove-link" onclick="changeQty('${id}',-${qty})">إزالة</button>
          </div>
        </div>
        <div class="line-total">${fmt(lineTotal)}</div>
      </div>
    `;
  }).join('');

  const { naiveSubtotal, originalSubtotal, savings } = computeTotals();
  const total = naiveSubtotal + DELIVERY_FEE;
  document.getElementById('subtotalVal').textContent = fmt(originalSubtotal);
  if (savings > 0){
    document.getElementById('savingsRow').style.display = 'flex';
    document.getElementById('savingsVal').textContent = '-' + fmt(savings);
  } else {
    document.getElementById('savingsRow').style.display = 'none';
  }
  document.getElementById('deliveryVal').textContent = fmt(DELIVERY_FEE);
  document.getElementById('totalVal').textContent = fmt(total);
  document.getElementById('checkoutBtn').disabled = false;
}

function changeQty(id, delta){
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  renderCart();
}

function openCart(){
  document.getElementById('cartPanel').classList.add('open');
  document.getElementById('cartOverlay').classList.add('open');
}
function closeCart(){
  document.getElementById('cartPanel').classList.remove('open');
  document.getElementById('cartOverlay').classList.remove('open');
}
document.getElementById('openCartBtn').addEventListener('click', openCart);
document.getElementById('closeCartBtn').addEventListener('click', closeCart);
document.getElementById('cartOverlay').addEventListener('click', closeCart);

/* ---------- طريقة الدفع ---------- */
function renderPaymentSection(){
  const section = document.getElementById('paymentMethodSection');
  const box = document.getElementById('paymentInfoBox');
  if (!PAYMENT_ACCOUNT){ section.classList.remove('active'); return; }
  section.classList.add('active');
  const label = PAYMENT_LABEL || 'الدفع الإلكتروني';
  document.getElementById('electronicOptionLabel').textContent = label;

  function updateBox(){
    const selected = document.querySelector('input[name="paymentMethod"]:checked').value;
    if (selected === 'electronic'){
      box.className = 'payment-info-box';
      box.innerHTML = `💳 <strong>${label}</strong><br>رقم الحساب: <strong>${PAYMENT_ACCOUNT}</strong><br>يرجى تحويل المبلغ وإرسال وصل التحويل بعد الطلب عبر واتساب.`;
    } else {
      box.className = '';
      box.innerHTML = '';
    }
  }
  document.querySelectorAll('input[name="paymentMethod"]').forEach(input=> input.addEventListener('change', updateBox));
  updateBox();
}

/* ---------- إتمام الطلب ---------- */
document.getElementById('checkoutBtn').addEventListener('click', ()=>{
  const ids = Object.keys(cart);
  if (ids.length === 0) return;

  if (!WHATSAPP_NUMBER){
    alert('لم يتم إعداد رقم واتساب المطعم بعد. الرجاء إعداده من لوحة التحكم.');
    return;
  }

  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();

  if (!phone){
    alert('الرجاء كتابة رقم هاتفك لإتمام الطلب.');
    document.getElementById('custPhone').focus();
    return;
  }

  let lines = "";
  const orderItems = [];
  ids.forEach(id=>{
    const item = ITEMS.find(x => x.id === id);
    if (!item) return;
    const qty = cart[id];
    const lineTotal = Number(item.price) * qty;
    lines += `• ${item.name} × ${qty} = ${fmt(lineTotal)}\n`;
    orderItems.push({ itemId: id, name: item.name, qty, unitPrice: Number(item.price), lineTotal });
  });

  const { naiveSubtotal, originalSubtotal, savings } = computeTotals();
  const total = naiveSubtotal + DELIVERY_FEE;

  let message = "مرحباً 👋، أريد تأكيد طلب جديد:\n\n";
  message += lines;
  message += `\nالمجموع قبل الخصم: ${fmt(originalSubtotal)}`;
  if (savings > 0) message += `\nإجمالي التوفير: -${fmt(savings)}`;
  message += `\nالتوصيل: ${fmt(DELIVERY_FEE)}`;
  message += `\nالمجموع الكلي: ${fmt(total)}`;
  if (name) message += `\n\nالاسم: ${name}`;
  message += `\nرقم الهاتف: ${phone}`;
  if (address) message += `\nالعنوان: ${address}`;

  let paymentMethodLabel = 'الدفع عند الاستلام';
  if (PAYMENT_ACCOUNT){
    const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked');
    const isElectronic = selectedMethod && selectedMethod.value === 'electronic';
    if (isElectronic){
      paymentMethodLabel = `${PAYMENT_LABEL || 'الدفع الإلكتروني'} (تحويل)`;
      message += `\n\nطريقة الدفع: ${paymentMethodLabel}`;
      message += `\n💳 رقم الحساب: ${PAYMENT_ACCOUNT}`;
      message += `\nسأرسل وصل التحويل بعد هذا الطلب.`;
    } else {
      message += `\n\nطريقة الدفع: الدفع عند الاستلام`;
    }
  }

  try{
    db.collection('orders').add({
      customerName: name || null,
      customerPhone: phone,
      customerAddress: address || null,
      items: orderItems,
      originalSubtotal,
      savings,
      deliveryFee: DELIVERY_FEE,
      total,
      paymentMethod: paymentMethodLabel,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(err => console.error('order save failed:', err));
  } catch(err){
    console.error('order save failed:', err);
  }

  const encoded = encodeURIComponent(message);
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encoded}`, '_blank');
});

initMenu();
</script>

</body>
</html>
